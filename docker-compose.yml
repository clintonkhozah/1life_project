services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentence_builder
      POSTGRES_USER: sentence_builder
      POSTGRES_PASSWORD: sentence_builder_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentence_builder -d sentence_builder"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentence_builder:sentence_builder_dev@db:5432/sentence_builder
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:4200
    command: ["sh", "-c", "npm run seed && npm start"]
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
